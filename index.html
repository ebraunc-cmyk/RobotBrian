<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Text Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard-container">
        <!-- Panel Izquierdo Informativo -->
        <aside class="sidebar">
            <h2>Gemini Hub</h2>
            <div class="status-box">
                <p>🔒 Servidor activo mediante la SDK oficial en la nube de Google.</p>
            </div>
        </aside>

        <!-- Área Principal del Chat -->
        <main class="main-content">
            <header>
                <h1>Asistente de Texto Inteligente</h1>
            </header>

            <!-- Respuestas de la IA -->
            <section class="response-area" id="responseArea">
                <div class="placeholder-text">Escribe un mensaje abajo para empezar...</div>
            </section>

            <!-- Caja de Entrada -->
            <section class="input-panel">
                <div class="input-wrapper">
                    <textarea id="textInput" placeholder="Escribe tu consulta aquí... (Ej: Hola, ¿cómo estás?)"></textarea>
                    <div class="action-buttons">
                        <button id="sendBtn" class="btn-primary">Enviar a Gemini</button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- NOTA CRÍTICA: Cambiado a type="module" para que el navegador acepte la SDK de Google -->
    <script type="module" src="script.js"></script>
</body>
</html>
